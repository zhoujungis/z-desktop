[package]
name = "z-desktop"
version = "0.1.0"
description = "Z Desktop - AI Computer Workspace"
authors = ["Z Desktop"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "z_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = "0.38"
arboard = "3"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
walkdir = "2"
regex = "1"
thiserror = "2"
base64 = "0.22"
futures = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process"] }
chromiumoxide = "0.9"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tempfile = "3"
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
uiautomation = "0.25"

[profile.release]
strip = true
lto = true
codegen-units = 1
