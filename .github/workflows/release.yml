name: CI / Release

# PR：全量测试 + Windows 打包验证（不发布）
# push main/master：全量测试 + 自动递增版本 + 打包 + 提交版本号 + 打 tag + 发布 Release
# workflow_dispatch：同上，可手动选择 patch / minor / major
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      bump:
        description: "版本递增类型"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: "20"

jobs:
  # ------------------------------------------------------------------
  # 1. 全量测试
  # ------------------------------------------------------------------
  test:
    name: Test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check version consistency
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAURI_VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          CARGO_VERSION=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "package.json=$PKG_VERSION"
          echo "tauri.conf.json=$TAURI_VERSION"
          echo "Cargo.toml=$CARGO_VERSION"
          test "$PKG_VERSION" = "$TAURI_VERSION"
          test "$PKG_VERSION" = "$CARGO_VERSION"

      - name: Validate version bump script
        shell: bash
        run: |
          NEXT=$(node scripts/bump-version.mjs --bump patch --dry-run)
          echo "next patch version: $NEXT"
          test -n "$NEXT"

      - name: Typecheck
        run: npm run typecheck

      - name: Frontend unit tests
        run: npm test

      - name: Rust formatting
        run: cargo fmt --all -- --check
        working-directory: src-tauri

      - name: Rust tests (unit + integration)
        run: cargo test --all-targets --locked
        working-directory: src-tauri

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: src-tauri

  # ------------------------------------------------------------------
  # 2. PR 打包验证：产出 NSIS .exe 与 .msi
  # ------------------------------------------------------------------
  build-pr:
    name: Build Windows bundles (PR)
    needs: test
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri -- build --bundles nsis,msi

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Get-ChildItem release-assets

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: z-desktop-windows-x64
          if-no-files-found: error
          retention-days: 7
          path: release-assets/*

  # ------------------------------------------------------------------
  # 3. 自动递增版本 + 打包 + 打 tag + 发布 Release
  # ------------------------------------------------------------------
  release:
    name: Auto bump, build & release
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Bump version
        id: version
        shell: bash
        run: |
          BUMP="${{ inputs.bump || 'patch' }}"
          VERSION=$(node scripts/bump-version.mjs --bump "$BUMP")
          TAG="v$VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists; refusing to overwrite."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Bump: $BUMP -> $VERSION"

      - name: Build Tauri app (NSIS + MSI)
        run: npm run tauri -- build --bundles nsis,msi

      - name: Stage release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe release-assets/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi release-assets/
          Get-ChildItem release-assets

      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum *.exe *.msi > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # 只有测试和打包都成功后才提交版本号、打 tag，失败不会留下脏版本
      - name: Commit version bump and tag
        id: publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            echo "::error::Version bump produced no changes."
            exit 1
          fi
          git commit -m "chore: release ${{ steps.version.outputs.tag }} [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ steps.publish.outputs.sha }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.prerelease == 'true' }}
          files: |
            release-assets/*.exe
            release-assets/*.msi
            release-assets/SHA256SUMS.txt
